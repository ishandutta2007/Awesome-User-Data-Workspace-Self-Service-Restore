<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .code-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Background subtle pulse animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    @keyframes pillFloat1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pillFloat2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }

    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-purple { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .stream-line { stroke-dasharray: 8, 12; animation: waveDash 14s linear infinite; }
    .float-card-1 { animation: pillFloat1 6s ease-in-out infinite; }
    .float-card-2 { animation: pillFloat2 7s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <circle class="orb-cyan" cx="180" cy="80" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-purple" cx="1020" cy="280" r="160" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />
  <circle cx="600" cy="40" r="100" fill="#059669" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic Data Stream Wave Lines -->
  <path class="stream-line" d="M -50,300 C 300,340 450,220 700,290 C 950,350 1100,240 1250,280" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.4" />
  <path class="stream-line" d="M -50,80 C 250,150 450,40 750,110 C 1000,170 1150,70 1250,100" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.35" style="animation-duration: 20s; animation-direction: reverse;" />

  <!-- Floating UI Metric Badges (Right / Corners, safely away from centered text) -->
  <g class="float-card-1" transform="translate(930, 45)">
    <rect width="210" height="58" rx="29" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="30" cy="29" r="15" fill="#0284c7" />
    <path d="M 24 29 L 28 33 L 37 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="27" fill="#94a3b8" font-size="11" font-weight="600" class="code-text" letter-spacing="1">SELF-SERVICE RESTORE</text>
    <text x="56" y="44" fill="#38bdf8" font-size="13" font-weight="700" class="code-text">Zero IT Ticket Delay</text>
  </g>

  <g class="float-card-2" transform="translate(60, 260)">
    <rect width="220" height="58" rx="29" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="30" cy="29" r="15" fill="#059669" />
    <path d="M 30 20 L 30 38 M 23 31 L 30 38 L 37 31" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="27" fill="#94a3b8" font-size="11" font-weight="600" class="code-text" letter-spacing="1">INSTANT RECOVERY</text>
    <text x="56" y="44" fill="#34d399" font-size="13" font-weight="700" class="code-text">Snapshots &amp; VDI Rollback</text>
  </g>

  <!-- High-Contrast Foreground Content (Protected from dynamic background overlays) -->
  <g id="foreground-header" transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Pill Category Indicator -->
    <rect x="-190" y="-55" width="380" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-168" cy="-39" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="-34" fill="#cbd5e1" font-size="13" font-weight="700" class="code-text" letter-spacing="2">ENTERPRISE CLUSTER &amp; VDI GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="32" fill="url(#title-grad)" font-size="40" font-weight="900" class="code-text" letter-spacing="-0.5">Awesome User Data Workspace</text>
    <text x="0" y="80" fill="#f8fafc" font-size="34" font-weight="800" class="code-text">&amp; Self-Service Restore</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="125" fill="#94a3b8" font-size="16" font-weight="400" class="code-text">
      Curated directory of Enterprise SaaS DaaS, Cloud Workspaces &amp; Open-Source Self-Service Backup Platforms
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 150)">
      <rect x="-270" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="-190" y="18" fill="#38bdf8" font-size="12" font-weight="600" class="code-text">☁️ Cloud VDI &amp; DaaS</text>

      <rect x="-85" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="18" fill="#34d399" font-size="12" font-weight="600" class="code-text">🔄 1-Click Rollback</text>

      <rect x="110" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="190" y="18" fill="#c084fc" font-size="12" font-weight="600" class="code-text">⚡ Open Source &amp; Self-Hosted</text>
    </g>
  </g>
</svg>